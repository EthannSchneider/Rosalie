# Migrations des bases de Rosalie (Alembic). Elles s'appliquent toutes seules au démarrage ;
# ce fichier sert à en écrire de nouvelles, depuis la racine du projet :
#
#   alembic -c migrations/alembic.ini --name main revision --autogenerate -m "ajoute X"
#   alembic -c migrations/alembic.ini --name config revision --autogenerate -m "ajoute Y"
#
# La base visée est celle de STORAGE_DIR (storages/ par défaut), ou -x db=<chemin>.

[config]
script_location = %(here)s/config
file_template = %%(rev)s_%%(slug)s
prepend_sys_path = %(here)s/..

[main]
script_location = %(here)s/main
file_template = %%(rev)s_%%(slug)s
prepend_sys_path = %(here)s/..
