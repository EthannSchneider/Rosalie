# Config mlx-lm (Apple Silicon) — QLoRA sur Qwen3 8B en 4 bits.
# ~9-11 Go de RAM pendant l'entraînement : OK sur un M3 Pro 18 Go
# (ferme Ollama / Chrome pendant le training : `ollama stop qwen3:8b`).
model: "mlx-community/Qwen3-8B-4bit"
train: true
fine_tune_type: lora
data: "finetune/data/mlx"
adapter_path: "finetune/output/adapters"

# On n'apprend que la réponse finale de Rosalie, pas les messages d'Ethann
mask_prompt: true

batch_size: 1
grad_accumulation_steps: 4
iters: 600            # ~2-3 epochs pour 200-300 exemples ; ajuste selon la taille du dataset
learning_rate: 1e-5
num_layers: 16        # couches adaptées (sur 36). Léger = garde ses capacités d'outils
max_seq_length: 3072
grad_checkpoint: true # économise de la RAM
steps_per_report: 10
steps_per_eval: 100
save_every: 100
val_batches: 25
seed: 42

lora_parameters:
  rank: 16
  scale: 20.0
  dropout: 0.05
